import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    alias libs.plugins.android.library
    id 'jacoco'
    id 'maven-publish'
    id 'signing'
}

android {
    namespace = "com.solanamobile.seekerconnect.android"
    compileSdk = 36

    defaultConfig {
        minSdk 23
    }

    buildTypes {
        debug {
            enableUnitTestCoverage = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlin {
        // The kotlin-stdlib version consumers resolve; Kotlin 2.1 compilers can't read a newer one.
        coreLibrariesVersion = "2.1.20"
        compilerOptions {
            jvmTarget = JvmTarget.JVM_11
            // Readable by consumers on Kotlin 2.1 (React Native apps).
            languageVersion = KotlinVersion.KOTLIN_2_1
            apiVersion = KotlinVersion.KOTLIN_2_1
        }
    }

    buildFeatures {
        buildConfig = false
    }

    testOptions {
        unitTests {
            // Robolectric reads the merged manifest (the <queries> declaration).
            includeAndroidResources = true
            all {
                jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.*']
                }
            }
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = group
            artifactId = 'seeker-connect'
            pom {
                name = 'Seeker Connect - Android'
                description = 'Android SDK for Seeker Connect: a direct, branded connection to a Solana Mobile certified device\'s wallet, built on Mobile Wallet Adapter.'
                url = 'https://github.com/solana-mobile/seeker-connect'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        name = 'Solana Mobile Engineering'
                        email = 'eng@solanamobile.com'
                        organization = 'Solana Mobile Inc.'
                        organizationUrl = 'https://solanamobile.com'
                    }
                }
                organization {
                    name = 'Solana Mobile Inc.'
                    url = 'https://solanamobile.com'
                }
                scm {
                    connection = 'scm:git:git://github.com/solana-mobile/seeker-connect.git'
                    developerConnection = 'scm:git:ssh://github.com/solana-mobile/seeker-connect.git'
                    url = 'https://github.com/solana-mobile/seeker-connect/tree/main'
                }
            }

            afterEvaluate {
                from components.findByName('release')
            }
        }
    }
}

signing {
    // Signing private key and password provided by ORG_GRADLE_PROJECT_signingKey and
    // ORG_GRADLE_PROJECT_signingPassword, respectively
    def signingKey = findProperty('signingKey')
    def signingPassword = findProperty('signingPassword')
    // Unsigned without a key, so local builds can publishToMavenLocal; releases always have one.
    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.release
    }
}

dependencies {
    api project(':seeker-connect-core')
    api libs.androidx.activity
    implementation libs.mwa.clientlib

    testImplementation testFixtures(project(':seeker-connect-core'))
    testImplementation libs.kotlin.test.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
}

def coverageVerification = tasks.register('jacocoDebugUnitTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn 'testDebugUnitTest'
    executionData.from(layout.buildDirectory.file('outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'))
    classDirectories.from(layout.buildDirectory.dir('intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes'))
    sourceDirectories.from('src/main/kotlin')
    violationRules {
        rule {
            // MwaSeekerLink's public constructor (1): tests use the internal one, which takes a fake association scenario.
            limit {
                counter = 'LINE'
                value = 'MISSEDCOUNT'
                maximum = 1
            }
        }
    }
}
tasks.named('check') { dependsOn coverageVerification }
