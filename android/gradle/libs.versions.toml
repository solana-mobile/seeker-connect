[versions]
# Versions match the mobile-wallet-adapter repo's catalog where they overlap.
androidGradlePlugin = "9.2.1"
kotlin = "2.4.10"
kotlinxCoroutines = "1.11.0"
mobileWalletAdapter = "2.2.0"
multimult = "0.2.6"
web3Core = "0.4.0-beta1"
androidxActivity = "1.13.0"
androidxTest = "1.7.0"
composeBom = "2026.08.00"
robolectric = "4.16.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
mwa-clientlib = { module = "com.solanamobile:mobile-wallet-adapter-clientlib", version.ref = "mobileWalletAdapter" }
multimult = { module = "io.github.funkatronics:multimult", version.ref = "multimult" }
web3-solana = { module = "com.solanamobile:web3-solana", version.ref = "web3Core" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidxActivity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
