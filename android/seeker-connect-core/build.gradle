import org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    alias libs.plugins.kotlin.jvm
    id 'java-test-fixtures'
    id 'jacoco'
    id 'maven-publish'
    id 'signing'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

kotlin {
    // The kotlin-stdlib version consumers resolve; Kotlin 2.1 compilers can't read a newer one.
    coreLibrariesVersion = "2.1.20"
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
        // No DefaultImpls bridges: no legacy consumers, and they are unreachable for the coverage gate.
        jvmDefault = JvmDefaultMode.NO_COMPATIBILITY
        // Readable by consumers on Kotlin 2.1 (React Native apps).
        languageVersion = KotlinVersion.KOTLIN_2_1
        apiVersion = KotlinVersion.KOTLIN_2_1
    }
}

dependencies {
    api libs.kotlinx.coroutines.core

    // The SeekerLink contract suite, run by every SeekerLink implementation's tests.
    testFixturesApi libs.kotlin.test.junit
    testFixturesApi libs.kotlinx.coroutines.test

    testImplementation libs.kotlin.test.junit
    testImplementation libs.kotlinx.coroutines.test
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = group
            artifactId = 'seeker-connect-core'
            from components.java
            pom {
                name = 'Seeker Connect - Core'
                description = 'Platform-agnostic Seeker Connect core: the client, models, error taxonomy, and the SeekerLink port each platform implements.'
                url = 'https://github.com/solana-mobile/seeker-connect'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        name = 'Solana Mobile Engineering'
                        email = 'eng@solanamobile.com'
                        organization = 'Solana Mobile Inc.'
                        organizationUrl = 'https://solanamobile.com'
                    }
                }
                organization {
                    name = 'Solana Mobile Inc.'
                    url = 'https://solanamobile.com'
                }
                scm {
                    connection = 'scm:git:git://github.com/solana-mobile/seeker-connect.git'
                    developerConnection = 'scm:git:ssh://github.com/solana-mobile/seeker-connect.git'
                    url = 'https://github.com/solana-mobile/seeker-connect/tree/main'
                }
            }
        }
    }
}

signing {
    // Signing private key and password provided by ORG_GRADLE_PROJECT_signingKey and
    // ORG_GRADLE_PROJECT_signingPassword, respectively
    def signingKey = findProperty('signingKey')
    def signingPassword = findProperty('signingPassword')
    // Unsigned without a key, so local builds can publishToMavenLocal; releases always have one.
    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.release
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            // No behavior to test: the compiler-generated default-argument constructors of SeekerAccount (Models.kt:14),
            // SeekerAuthorization (Models.kt:83), SeekerWalletCapabilities (Models.kt:97) and DappIdentity
            // (SeekerConnectConfig.kt:28), and SeekerConnectPresenter.None's empty interactionFailed (SeekerConnectPresenter.kt:22).
            limit {
                counter = 'LINE'
                value = 'MISSEDCOUNT'
                maximum = 5
            }
        }
    }
}

test.finalizedBy jacocoTestReport
check.dependsOn jacocoTestCoverageVerification
