name: Build React Native Example App

on:
  push:
    branches: [ main ]
    paths: [ '.github/**', 'js/**', 'android/**' ]
  # Any base branch, so stacked pull requests are checked too.
  pull_request:
    paths: [ '.github/**', 'js/**', 'android/**' ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    name: Example App
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: true
          cache_dependency_path: 'js/pnpm-lock.yaml'
          package_json_file: 'js/package.json'

      - name: set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The example builds against the Android SDK from this repository.
      - name: 'Publish the Android SDK to Maven Local'
        working-directory: 'android/'
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: 'Build Project'
        working-directory: 'js/'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: '[Example App] Format Check'
        working-directory: 'js/'
        run: pnpm exec prettier --check examples/example-react-native
      - name: '[Example App] Lint'
        working-directory: 'js/'
        run: pnpm exec eslint examples/example-react-native
      - name: '[Example App] Type Check'
        working-directory: 'js/examples/example-react-native/'
        run: pnpm exec tsc --noEmit
      # A debug build loads JS from Metro, so bundle it here to check that the app's imports resolve.
      - name: '[Example App] Bundle'
        working-directory: 'js/examples/example-react-native/'
        run: pnpm exec react-native bundle --platform android --dev false --entry-file index.js --bundle-output "$RUNNER_TEMP/index.android.bundle"
      - name: '[Example App] Build'
        working-directory: 'js/examples/example-react-native/android/'
        run: ./gradlew assembleDebug --no-daemon --stacktrace
