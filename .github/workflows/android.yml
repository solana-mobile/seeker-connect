name: Android CI

on:
  push:
    branches: [ main ]
    paths: [ '.github/**', 'android/**' ]
  pull_request:
    branches: [ main ]
    paths: [ '.github/**', 'android/**' ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner image provides JDK 17 and the Android SDK.
      - name: '[android] Check (tests, coverage gates, lint)'
        working-directory: 'android/'
        run: ./gradlew check --console=plain

      - name: '[android] Build example'
        working-directory: 'android/'
        run: ./gradlew :example:assembleDebug --console=plain

      # Publish to Maven Central (only for releases that start with 'v')
      - name: '[android] Publish to Maven Central (release only)'
        if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v') && !github.event.repository.fork }}
        working-directory: 'android/'
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_CENTRAL_PUBLISHING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_CENTRAL_PUBLISHING_PRIVATE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVEN_CENTRAL_PUBLISHING_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVEN_CENTRAL_PUBLISHING_PASSWORD }}
          TAG: ${{ github.event.release.tag_name }}
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository -P version=${TAG:1}
