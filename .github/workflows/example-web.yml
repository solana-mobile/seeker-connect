name: Publish Example Web App

on:
  push:
    branches: [ main ]
    paths: [ '.github/**', 'js/**' ]
  pull_request:
    branches: [ main ]
    paths: [ '.github/**', 'js/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: true
          cache_dependency_path: 'js/pnpm-lock.yaml'
          package_json_file: 'js/package.json'

      - name: '[js] Install dependencies'
        working-directory: 'js/'
        run: pnpm install --frozen-lockfile

      # Builds the workspace packages and the example (turbo), including the
      # example's tsc type check via its build script.
      - name: '[js] Build'
        working-directory: 'js/'
        run: pnpm build

      # Rebuild the example with a relative base so it works when served from
      # a gh-pages subdirectory (vite.config.ts sets no base for local dev).
      - name: '[example-web] Build for GitHub Pages'
        working-directory: 'js/examples/example-web/'
        env:
          # The relay host is not committed to source; inject it at build
          # time so the published bundle can reach the real relay.
          VITE_RELAY_DOMAIN: ${{ secrets.SM_NOSTR_RELAY_URL }}
        run: pnpm exec vite build --base ./

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-web
          path: js/examples/example-web/dist/*
          if-no-files-found: error
          retention-days: 1

  publish-to-gh-pages:
    runs-on: ubuntu-latest
    needs: build
    concurrency: publish-to-gh-pages
    if: ${{ github.event_name == 'push' && !github.event.repository.fork }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          token: ${{ steps.app-token.outputs.token }}

      - name: Refresh example-web directory
        run: rm -rf example-web

      - name: Download Example Web App
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: example-web
          path: example-web

      - name: Commit and push to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update Example Web App"
            git push origin gh-pages
          fi
